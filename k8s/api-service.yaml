# Expõe a API fora do cluster pelo NodePort 30080, que o cluster kind
# publica no host (infra/cluster.tf): http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: garagehub-api
  labels:
    app.kubernetes.io/name: garagehub-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: garagehub-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
