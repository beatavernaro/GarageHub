# Service interno do Mailpit: a API envia os e-mails para garagehub-mailpit:1025.
# A interface web não é exposta fora do cluster; para acessá-la:
#   kubectl -n garagehub port-forward svc/garagehub-mailpit 8025:8025
#   http://localhost:8025
apiVersion: v1
kind: Service
metadata:
  name: garagehub-mailpit
  labels:
    app.kubernetes.io/name: garagehub-mailpit
spec:
  selector:
    app.kubernetes.io/name: garagehub-mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
