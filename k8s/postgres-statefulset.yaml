# PostgreSQL com armazenamento persistente.
# Depende dos recursos criados pelo Terraform (infra/database.tf):
#   - StorageClass garagehub-db
#   - ConfigMap garagehub-db-init (01-schema.sql e 02-seed.sql)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garagehub-db
  labels:
    app.kubernetes.io/name: garagehub-db
spec:
  serviceName: garagehub-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garagehub-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garagehub-db
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: garagehub-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: garagehub-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: garagehub-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Verificação via TCP: durante a execução dos scripts de inicialização
          # o PostgreSQL escuta apenas no socket local, então o pod só fica
          # pronto depois que o schema e o seed terminarem.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init-scripts
          configMap:
            name: garagehub-db-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: garagehub-db
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
