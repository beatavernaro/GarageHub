name: CI/CD

# Pull requests: build, testes e validação do Dockerfile (sem publicar nem implantar).
# Push na main / execução manual: build e testes -> publicação da imagem no GHCR ->
# deploy em um cluster Kubernetes efêmero (kind) criado no runner pelo Terraform de infra/.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  TERRAFORM_VERSION: '1.16.6'
  KIND_VERSION: 'v0.33.0'
  CLUSTER_NAME: garagehub
  NAMESPACE: garagehub

jobs:
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest

    # Banco usado pelos testes de integração
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: garagehub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d garagehub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Inicializar banco (schema e seed)
        run: |
          for script in src/Infrastructure/Database/*.sql; do
            echo "Executando ${script}"
            docker exec -i "${{ job.services.postgres.id }}" \
              psql -U postgres -d garagehub -v ON_ERROR_STOP=1 -q < "${script}"
          done

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Testes unitários e de integração
        run: dotnet test tests/Tests/Tests.csproj --no-build -c Release

  image:
    name: Imagem Docker
    needs: build-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      repository: ${{ steps.meta.outputs.repository }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Definir nome e tag da imagem
        id: meta
        run: |
          # O GHCR exige o nome do repositório em minúsculas
          echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/garagehub-api" >> "${GITHUB_OUTPUT}"
          echo "tag=sha-${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Em pull requests a imagem é apenas construída, para validar o Dockerfile
      - name: Build e publicação
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.repository }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.repository }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy no Kubernetes (kind)
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    env:
      IMAGE: ${{ needs.image.outputs.repository }}:${{ needs.image.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Instalar kind
        run: |
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          curl -fsSLo kind.sha256 "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64.sha256sum"
          echo "$(awk '{print $1}' kind.sha256)  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind
          rm kind kind.sha256
          kind version
          kubectl version --client

      - name: Provisionar cluster (terraform apply)
        run: |
          terraform -chdir=infra init -input=false
          terraform -chdir=infra apply -auto-approve -input=false
          kubectl get nodes

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Carregar a imagem publicada no cluster
        run: |
          docker pull "${IMAGE}"
          kind load docker-image "${IMAGE}" --name "${CLUSTER_NAME}"

      - name: Gerar k8s/secrets.env a partir dos GitHub Secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
        run: |
          if [[ -z "${POSTGRES_PASSWORD}" || -z "${JWT_KEY}" ]]; then
            echo "::error::Configure os secrets POSTGRES_PASSWORD e JWT_KEY no repositório (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [[ "${#JWT_KEY}" -lt 32 ]]; then
            echo "::error::O secret JWT_KEY deve ter pelo menos 32 caracteres."
            exit 1
          fi
          umask 077
          {
            echo "POSTGRES_USER=postgres"
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "JWT_KEY=${JWT_KEY}"
          } > k8s/secrets.env

      - name: Usar a imagem publicada nos manifestos
        run: |
          repository="${IMAGE%:*}"
          tag="${IMAGE##*:}"
          sed -i \
            -e "s#^    newName: garagehub-api\$#    newName: ${repository}#" \
            -e "s#^    newTag: local\$#    newTag: ${tag}#" \
            k8s/kustomization.yaml
          grep -q "newTag: ${tag}" k8s/kustomization.yaml
          kubectl kustomize k8s | grep "image: ${IMAGE}"

      - name: Aplicar manifestos (kubectl apply -k)
        run: kubectl apply -k k8s

      - name: Aguardar rollout do banco, do Mailpit e da API
        run: |
          kubectl -n "${NAMESPACE}" rollout status statefulset/garagehub-db --timeout=300s
          kubectl -n "${NAMESPACE}" rollout status deployment/garagehub-mailpit --timeout=300s
          kubectl -n "${NAMESPACE}" rollout status deployment/garagehub-api --timeout=300s
          kubectl -n "${NAMESPACE}" get pods,services,hpa

      - name: Smoke test da API
        run: bash scripts/smoke-test.sh

      # Demonstração do escalonamento automático. É informativa: o resultado
      # depende dos recursos do runner, então não reprova o pipeline.
      - name: Demonstração do HPA
        continue-on-error: true
        env:
          DURATION: '150'
          SCALE_DOWN_WAIT: '0'
        run: bash scripts/load-test.sh

      - name: Diagnóstico
        if: failure()
        run: |
          kubectl -n "${NAMESPACE}" get all,pvc,events --sort-by=.metadata.creationTimestamp || true
          kubectl -n "${NAMESPACE}" describe pods || true
          kubectl -n "${NAMESPACE}" logs -l app.kubernetes.io/name=garagehub-api --tail=100 --all-containers || true
          kubectl -n "${NAMESPACE}" logs -l app.kubernetes.io/name=garagehub-db --tail=100 || true

      - name: Remover cluster (terraform destroy)
        if: always()
        run: |
          terraform -chdir=infra destroy -auto-approve -input=false \
            || terraform -chdir=infra destroy -auto-approve -input=false -refresh=false \
            || kind delete cluster --name "${CLUSTER_NAME}"
