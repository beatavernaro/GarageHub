services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: garagehub-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=garagehub;Username=postgres;Password=postgres"
    depends_on:
      - db

  db:
    image: postgres:18
    container_name: garagehub-db
    environment:
      POSTGRES_DB: garagehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"