services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: garagehub-api

    ports:
      - "8080:8080"

    # Valores lidos do arquivo .env (veja .env.example).
    # Os padrões após ":-" existem apenas para o ambiente local de desenvolvimento.
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-garagehub};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__Key: "${JWT_KEY:-GarageHub-Development-Jwt-Key-2026-FIAP-Local-Environment}"
      Smtp__Host: mailpit
      Smtp__Port: "1025"

    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Servidor SMTP de testes: captura os e-mails enviados pela API
  # e os exibe na interface web em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27.0

    container_name: garagehub-mailpit

    ports:
      - "8025:8025"
      - "1025:1025"

  db:
    image: postgres:18

    container_name: garagehub-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-garagehub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./src/Infrastructure/Database:/docker-entrypoint-initdb.d

volumes:
  postgres_data:
